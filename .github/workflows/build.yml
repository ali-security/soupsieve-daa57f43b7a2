name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest -k expression to narrow the test run'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        # CPython patch levels pinned to the releases current at 2.4.1's release
        # date: later 3.9/3.10/3.11 patches carry the html.parser rawtext change
        # that makes `<iframe>` content unparsed, which breaks the iframe tests.
        include:
          - tox-env: py37
            python-version: 3.7
          - tox-env: py38
            python-version: 3.8
          # 3.9.13 is the newest 3.9 actions/setup-python can provision on
          # Windows; later 3.9 patches are source-only.
          - tox-env: py39
            python-version: '3.9.13'
          - tox-env: py310
            python-version: '3.10.11'
          - tox-env: py311
            python-version: '3.11.3'
          - tox-env: nolxml
            python-version: '3.11.3'
          - tox-env: nohtml5lib
            python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' pip setuptools build tox coverage
    - name: Test
      shell: bash
      run: |
        if [ -n "${{ github.event.inputs.test-filter }}" ]; then
          python -m tox -- -k "${{ github.event.inputs.test-filter }}"
        else
          python -m tox
        fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.9
    - name: Package
      run: |
        pip install --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' 'build==0.10.0' 'setuptools==67.6.1' 'hatchling==1.14.0'
        python -m build --no-isolation -s -w
        ls -l dist
    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
